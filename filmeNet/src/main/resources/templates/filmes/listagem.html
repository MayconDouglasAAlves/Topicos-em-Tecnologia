<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template.html}">
<head>
    <meta charset="UTF-8">
    <title>Listagem de Filmes</title>
</head>

<body>
    <div layout:fragment="conteudo">
    <h1>Listagem de Filmes - Exemplo</h1>

        <table>
            <thead>
            <tr>
                <th>Nome</th>
                <th>Genero</th>
                <th>Ações</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="filme : ${lista}">
                <td th:text="${filme.nome}"></td>
                <td th:text="${filme.genero}"></td>
                <td>
                    <a th:href="@{/filmes/formulario?id={id}(id=${filme.id})}">Editar</a>
                    <form action="/filmes" method="post">
                        <input type="hidden" name="_method" value="delete">
                        <input type="hidden" name="id" th:value="${filme.id}">
                        <input type="submit" value="Excluir">
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
