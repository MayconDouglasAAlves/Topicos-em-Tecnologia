<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template.html}">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Filmes</title>
</head>

<body>
    <div layout:fragment="conteudo">
        <h1>Cadastro de Filmes - Exemplo</h1>

        <form method="post" th:action="@{'/filmes/formulario'}">

            <div>
            <input type="hidden" name="_method" value="put" th:if="${filme!=null}">
            <input type="hidden" name="id" th:value="${filme?.id}">
                <label for="nome">Nome:</label>
                <input id="nome" name="nome" th:value="${filme?.nome}">
            </div>
            <br>
            <br>
            <div>
                <label for="ano">Ano de Lançamento:</label>
                <input id="ano" name="ano" th:value="${filme?.ano}">
            </div>
            <br>
            <br>
            <div>
                <label for="genero">Gênero:</label>
                <input id="genero" name="genero"th:value="${filme?.genero}">
            </div>
            <br>
            <br>
            <input type="submit" th:value="${filme==null}?'Cadastrar':'Atualizar'">
        </form>
    </div>
</body>
</html>
