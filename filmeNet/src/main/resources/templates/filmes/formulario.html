<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template.html}">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Filmes</title>
</head>

<body>
<div layout:fragment="conteudo">
    <h1>Cadastro de Filmes - Exemplo</h1>

    <form method="post" th:action="${filme != null} ? @{/filmes/{id}(id=${filme.id})} : @{/filmes/formulario}">
        <input th:if="${filme != null}" type="hidden" name="_method" value="put">
        <div>
            <label for="nome">Nome:</label>
            <input id="nome" name="nome" th:value="${filme != null} ? ${filme.nome} : ''">
        </div>
        <br>
        <br>
        <div>
            <label for="ano">Ano de Lançamento:</label>
            <input id="ano" name="ano" th:value="${filme != null} ? ${filme.ano} : ''">
        </div>
        <br>
        <br>
        <div>
            <label for="genero">Gênero:</label>
            <input id="genero" name="genero" th:value="${filme != null} ? ${filme.genero} : ''">
        </div>
        <br>
        <br>
        <input type="submit" th:value="${filme != null} ? 'Atualizar' : 'Cadastrar'">
    </form>
</div>
</body>
</html>
